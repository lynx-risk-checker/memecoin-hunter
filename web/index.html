<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>MEMECOIN HUNTER</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#f8fafc}main{max-width:760px;margin:auto;padding:20px}.card{background:#121a2e;border:1px solid #26324d;border-radius:16px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;overflow:auto}.status{font-size:1.4rem;font-weight:700}button{padding:10px 14px;border-radius:10px;border:0}</style></head><body><main><h1>MEMECOIN HUNTER</h1><div class="card"><div class="status" id="status">CONNECTING...</div><div id="time"></div></div><div class="card"><h2>Snapshot</h2><pre id="snapshot">No snapshot loaded.</pre></div><button onclick="loadSnapshot()">Refresh</button></main><script>async function loadSnapshot(){try{const r=await fetch('/snapshot',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.querySelector('#status').textContent=d.validation_status||d.status||'CONNECTED';document.querySelector('#time').textContent=new Date().toISOString();document.querySelector('#snapshot').textContent=JSON.stringify(d,null,2)}catch(e){document.querySelector('#status').textContent='BACKEND UNAVAILABLE';document.querySelector('#snapshot').textContent=String(e)}}loadSnapshot();</script></body></html>
